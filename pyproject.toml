[project]
name = "kalkulaator"
version = "1.0.0"
description = "Lihtne Pythonis kirjutatud käsurea kalkulaator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.coverage.run]
source = ["kalkulaator"]

[tool.coverage.report]
show_missing = true
fail_under = 80
